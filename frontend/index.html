<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Iniciar sesión · Facturador FL</title>
<link rel="stylesheet" href="/ui.css">
<style>
  .split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(360px,1fr);min-height:100vh}
  .hero{display:flex;flex-direction:column;justify-content:space-between;gap:48px;padding:40px 56px;
    background:var(--accent);color:var(--accent-ink)}
  .hero .wordmark{color:var(--accent-ink)}
  .hero h1{font-size:clamp(48px,7.4vw,112px);line-height:.95;max-width:11ch}
  .hero p{margin-top:24px;max-width:34ch;font-size:18px}
  .hero .hypno{color:var(--accent-ink)}
  .login{display:grid;align-content:center;padding:40px 56px;max-width:520px;width:100%}
  .login h2{font-size:44px;margin-bottom:8px}
  .lead{margin-bottom:32px;color:var(--muted)}
  .login .btn{width:100%}
  @media (max-width:860px){
    .split{grid-template-columns:1fr}
    .hero{gap:32px;padding:28px 24px 32px}
    .hero h1{font-size:clamp(44px,13vw,72px)}
    .login{padding:36px 24px 48px;max-width:none}
  }
</style>
</head>
<body>
<div class="split">
  <section class="hero">
    <span class="wordmark">Facturador FL</span>
    <div>
      <h1>Del estudio de sueño a la factura.</h1>
      <p>Pacientes, precios e historial de facturas en un solo lugar.</p>
    </div>
    <div class="hypno" aria-hidden="true">
      <svg viewBox="0 0 1000 200" preserveAspectRatio="none">
        <path pathLength="1" d="M0 20H40V100H70V140H130V180H230V140H300V60H340V140H420V180H500V140H560V60H640V140H700V100H730V140H790V60H900V20H1000"/>
      </svg>
    </div>
  </section>
  <main class="login">
    <h2>Iniciar sesión</h2>
    <p class="lead">Ingresa con tu usuario y contraseña.</p>
    <div class="alert" id="errMsg" role="alert"><span id="errTxt"></span></div>
    <div class="field"><label for="usr">Usuario</label><input id="usr" autocomplete="username" autofocus></div>
    <div class="field"><label for="pwd">Contraseña</label><input id="pwd" type="password" autocomplete="current-password"></div>
    <button class="btn" id="btnLogin">Entrar</button>
  </main>
</div>
<script>
  const btn = document.getElementById("btnLogin");
  const err = document.getElementById("errMsg");
  const errTxt = document.getElementById("errTxt");
  let errTimer;
  function showErr(msg){
    errTxt.textContent = msg; err.classList.add("show");
    clearTimeout(errTimer); errTimer = setTimeout(()=>err.classList.remove("show"), 4000);
  }
  async function doLogin(){
    const usr = document.getElementById("usr").value.trim();
    const pwd = document.getElementById("pwd").value;
    if(!usr || !pwd){ showErr("Completa todos los campos"); return; }
    btn.textContent = "Ingresando…"; btn.disabled = true;
    try{
      const res = await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({username:usr,password:pwd})});
      const data = await res.json();
      if(!res.ok){ showErr(data.error || "Error al iniciar sesión"); return; }
      localStorage.setItem("token", data.token);
      localStorage.setItem("user", JSON.stringify(data.user));
      window.location.href = "/dashboard";
    }catch(e){
      console.error("Login falló:", e);
      showErr("Error de conexión con el servidor");
    }finally{
      btn.textContent = "Entrar"; btn.disabled = false;
    }
  }
  btn.onclick = doLogin;
  document.addEventListener("keydown", e => { if(e.key === "Enter") doLogin(); });
</script>
</body>
</html>
