<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iniciar sesión · Facturador FL</title>
<link rel="stylesheet" href="/ui.css">
<style>
  body{display:grid;place-items:center;padding:24px}
  .panel{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:32px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:24px;font-weight:600}
  .brand .mark{width:32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center}
  h1{font-size:22px;margin-bottom:4px}
  .lead{margin:0 0 24px;color:var(--muted);font-size:14px}
  .btn{width:100%}
</style>
</head>
<body>
<main class="panel">
  <div class="brand">
    <span class="mark"><svg class="icon" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></span>
    Facturador FL
  </div>
  <h1>Iniciar sesión</h1>
  <p class="lead">Ingresa con tu usuario y contraseña.</p>
  <div class="alert" id="errMsg" role="alert"><span id="errTxt"></span></div>
  <div class="field"><label for="usr">Usuario</label><input id="usr" autocomplete="username" autofocus></div>
  <div class="field"><label for="pwd">Contraseña</label><input id="pwd" type="password" autocomplete="current-password"></div>
  <button class="btn" id="btnLogin">Entrar</button>
</main>
<script>
  const btn = document.getElementById("btnLogin");
  const err = document.getElementById("errMsg");
  const errTxt = document.getElementById("errTxt");
  let errTimer;
  function showErr(msg){
    errTxt.textContent = msg; err.classList.add("show");
    clearTimeout(errTimer); errTimer = setTimeout(()=>err.classList.remove("show"), 4000);
  }
  async function doLogin(){
    const usr = document.getElementById("usr").value.trim();
    const pwd = document.getElementById("pwd").value;
    if(!usr || !pwd){ showErr("Completa todos los campos"); return; }
    btn.textContent = "Ingresando…"; btn.disabled = true;
    try{
      const res = await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({username:usr,password:pwd})});
      const data = await res.json();
      if(!res.ok){ showErr(data.error || "Error al iniciar sesión"); return; }
      localStorage.setItem("token", data.token);
      localStorage.setItem("user", JSON.stringify(data.user));
      window.location.href = "/dashboard";
    }catch(e){
      console.error("Login falló:", e);
      showErr("Error de conexión con el servidor");
    }finally{
      btn.textContent = "Entrar"; btn.disabled = false;
    }
  }
  btn.onclick = doLogin;
  document.addEventListener("keydown", e => { if(e.key === "Enter") doLogin(); });
</script>
</body>
</html>
