<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Panel · Facturador FL</title>
<link rel="stylesheet" href="/ui.css">
<style>
  .who{display:flex;align-items:center;gap:16px;font-size:14px}
  .role{color:var(--muted)}
  .date{margin-bottom:12px;color:var(--muted);font-size:15px}
  .date::first-letter{text-transform:uppercase}
  .wrap h1{font-size:clamp(52px,10vw,136px);line-height:.92;max-width:14ch;letter-spacing:-.02em}
  .wrap .hypno{margin:36px 0 12px;color:var(--ink)}
  .wrap .hypno svg{height:72px}
  .wrap .hypno path{stroke-width:2}
  .index{border-top:1px solid var(--ink)}
  .row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:baseline;
    padding:24px 0;border-bottom:1px solid var(--ink);color:var(--ink);text-decoration:none;
    transition:background 150ms ease-out,box-shadow 150ms ease-out}
  .row h2{font-size:clamp(34px,4.6vw,60px)}
  .row p{color:var(--muted);max-width:44ch;transition:color 150ms ease-out}
  .row:hover,.row:focus-visible{background:var(--accent);color:var(--accent-ink);box-shadow:-14px 0 0 var(--accent),14px 0 0 var(--accent)}
  .row:hover p,.row:focus-visible p{color:var(--accent-ink)}
  .row:focus-visible{outline-offset:-3px}
  footer{max-width:1120px;margin:0 auto;padding:24px 32px 40px;display:flex;flex-wrap:wrap;gap:12px;
    justify-content:space-between;color:var(--muted);font-size:14px}
  @media (max-width:720px){
    .row{grid-template-columns:1fr;gap:8px;padding:20px 0}
    .who .name{display:none}
    footer{padding:24px 16px 32px}
  }
</style>
</head>
<body>
<header class="bar">
  <span class="wordmark">Facturador FL</span>
  <div class="who">
    <span class="name" id="userName"></span>
    <span class="role" id="roleBadge"></span>
    <button class="btn btn-ghost btn-sm" id="btnLogout">Salir</button>
  </div>
</header>
<main class="wrap">
  <div class="date" id="dateStr"></div>
  <h1><span id="greet"></span>, <span id="welcomeName"></span>.</h1>
  <div class="hypno" aria-hidden="true">
    <svg viewBox="0 0 1000 200" preserveAspectRatio="none">
      <path pathLength="1" d="M0 20H40V100H70V140H130V180H230V140H300V60H340V140H420V180H500V140H560V60H640V140H700V100H730V140H790V60H900V20H1000"/>
    </svg>
  </div>
  <nav class="index" id="modulesGrid" aria-label="Módulos"></nav>
</main>
<footer>
  <span>© 2026 Felix Linares</span>
  <a href="https://wa.me/573183979833" target="_blank" rel="noopener">Soporte por WhatsApp · 318 397 9833</a>
</footer>
<script>
  const token = localStorage.getItem("token");
  const user  = JSON.parse(localStorage.getItem("user") || "null");
  if(!token || !user){ window.location.href = "/"; }
  const modules = user.modules || [];
  const isAdmin = user.role === "admin";
  const name    = user.name || user.username;
  const hour    = new Date().getHours();
  document.getElementById("greet").textContent = hour < 12 ? "Buenos días" : hour < 19 ? "Buenas tardes" : "Buenas noches";
  document.getElementById("userName").textContent = name;
  document.getElementById("welcomeName").textContent = name.split(" ")[0];
  document.getElementById("roleBadge").textContent = isAdmin ? "Administrador" : "Usuario";
  document.getElementById("dateStr").textContent = new Date().toLocaleDateString("es-CO",
    {weekday:"long", day:"numeric", month:"long", year:"numeric"});

  const MODS = [
    {href:"/medical",       title:"Facturador médico",     desc:"Pacientes y estudios de polisomnografía, con historial y exportación a PDF o Word.", visible: modules.includes("medical") || isAdmin},
    {href:"/personal",      title:"Facturador personal",   desc:"Facturas con varias monedas, IVA y estado de pago.",                                visible: modules.includes("personal") || isAdmin},
    {href:"/tasks",         title:"Mis tareas",            desc:"Recordatorios y actividades pendientes con alertas.",                               visible: modules.includes("tasks") || isAdmin},
    {href:"/admin",         title:"Administración",        desc:"Usuarios, permisos y módulos del sistema.",                                         visible: isAdmin},
    {href:"/login-history", title:"Historial de sesiones", desc:"Inicios de sesión, intentos fallidos y cierres de sesión.",                         visible: true}
  ];
  const grid = document.getElementById("modulesGrid");
  MODS.filter(m => m.visible).forEach(m => {
    const a = document.createElement("a");
    a.href = m.href; a.className = "row";
    a.innerHTML = "<h2></h2><p></p>";
    a.querySelector("h2").textContent = m.title;
    a.querySelector("p").textContent = m.desc;
    grid.appendChild(a);
  });
  document.getElementById("btnLogout").onclick = async () => {
    try{
      await fetch("/api/auth/logout",{method:"POST",headers:{Authorization:`Bearer ${token}`}});
    }catch(e){ console.error("Logout falló:", e); }
    localStorage.clear();
    window.location.href = "/";
  };
</script>
</body>
</html>
