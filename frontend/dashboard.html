<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel · Facturador FL</title>
<link rel="stylesheet" href="/ui.css">
<style>
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px;
    background:var(--surface);border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600}
  .brand .mark{width:28px;height:28px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center}
  .brand .icon{width:16px;height:16px}
  .who{display:flex;align-items:center;gap:12px;font-size:14px}
  .role{font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:999px;
    background:var(--accent-soft);color:var(--accent)}
  .wrap{max-width:960px;margin:0 auto;padding:40px 24px 24px}
  .date{color:var(--muted);font-size:13px;text-transform:capitalize;margin-bottom:4px}
  h1{font-size:26px;margin-bottom:4px}
  .lead{margin:0 0 28px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
  .card{display:block;padding:20px;background:var(--surface);border:1px solid var(--border);
    border-radius:10px;color:inherit;text-decoration:none;transition:border-color .2s var(--ease),transform .2s var(--ease)}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card .ico{width:36px;height:36px;border-radius:8px;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;margin-bottom:14px}
  .card h2{font-size:16px;margin-bottom:6px}
  .card p{margin:0;color:var(--muted);font-size:14px}
  footer{max-width:960px;margin:0 auto;padding:24px;display:flex;flex-wrap:wrap;gap:12px;
    justify-content:space-between;color:var(--muted);font-size:13px}
  @media (max-width:520px){.who .name{display:none}.bar{padding:12px 16px}.wrap{padding:28px 16px}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <span class="mark"><svg class="icon" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></span>
    Facturador FL
  </div>
  <div class="who">
    <span class="name" id="userName"></span>
    <span class="role" id="roleBadge"></span>
    <button class="btn btn-ghost" id="btnLogout">Salir</button>
  </div>
</header>
<main class="wrap">
  <div class="date" id="dateStr"></div>
  <h1>Hola, <span id="welcomeName"></span></h1>
  <p class="lead">Elige un módulo para continuar.</p>
  <div class="grid" id="modulesGrid"></div>
</main>
<footer>
  <span>© 2026 Felix Linares</span>
  <a href="https://wa.me/573183979833" target="_blank" rel="noopener">Soporte por WhatsApp · 318 397 9833</a>
</footer>
<script>
  const token = localStorage.getItem("token");
  const user  = JSON.parse(localStorage.getItem("user") || "null");
  if(!token || !user){ window.location.href = "/"; }
  const modules = user.modules || [];
  const isAdmin = user.role === "admin";
  const name    = user.name || user.username;
  document.getElementById("userName").textContent = name;
  document.getElementById("welcomeName").textContent = name.split(" ")[0];
  document.getElementById("roleBadge").textContent = isAdmin ? "ADMIN" : "USUARIO";
  document.getElementById("dateStr").textContent = new Date().toLocaleDateString("es-CO",
    {weekday:"long", day:"numeric", month:"long", year:"numeric"});

  const ICONS = {
    medical:  '<path d="M12 5v14M5 12h14"/>',
    personal: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
    tasks:    '<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
    admin:    '<path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h10M18 18h2"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/>',
    history:  '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
  };
  const MODS = [
    {id:"medical",  href:"/medical",       title:"Facturador médico",    desc:"Pacientes y estudios de polisomnografía, con historial y exportación a PDF o Word.", visible: modules.includes("medical") || isAdmin},
    {id:"personal", href:"/personal",      title:"Facturador personal",  desc:"Facturas con varias monedas, IVA y estado de pago.",                                visible: modules.includes("personal") || isAdmin},
    {id:"tasks",    href:"/tasks",         title:"Mis tareas",           desc:"Recordatorios y actividades pendientes con alertas.",                               visible: modules.includes("tasks") || isAdmin},
    {id:"admin",    href:"/admin",         title:"Administración",       desc:"Usuarios, permisos y módulos del sistema.",                                         visible: isAdmin},
    {id:"history",  href:"/login-history", title:"Historial de sesiones",desc:"Inicios de sesión, intentos fallidos y cierres de sesión.",                         visible: true}
  ];
  const grid = document.getElementById("modulesGrid");
  MODS.filter(m => m.visible).forEach(m => {
    const a = document.createElement("a");
    a.href = m.href; a.className = "card";
    a.innerHTML = `<div class="ico"><svg class="icon" viewBox="0 0 24 24">${ICONS[m.id]}</svg></div><h2></h2><p></p>`;
    a.querySelector("h2").textContent = m.title;
    a.querySelector("p").textContent = m.desc;
    grid.appendChild(a);
  });
  document.getElementById("btnLogout").onclick = async () => {
    try{
      await fetch("/api/auth/logout",{method:"POST",headers:{Authorization:`Bearer ${token}`}});
    }catch(e){ console.error("Logout falló:", e); }
    localStorage.clear();
    window.location.href = "/";
  };
</script>
</body>
</html>
